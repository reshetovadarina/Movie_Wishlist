<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мій список фільмів</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <button id="theme-button">Змінити тему</button>

    <h1>Мої улюблені фільми</h1>
    <p id="counter"></p>

    <div id="app">
      <div id="add-movie-block">
        <div class="tabs-nav">
          <button type="button" class="tab-btn active" data-tab="tab-omdb">
            Пошук в OMDb
          </button>
          <button type="button" class="tab-btn" data-tab="tab-manual">
            Вручну
          </button>
        </div>

        <div class="tabs-content">
          <div id="tab-omdb" class="tab-panel active">
            <div class="omdb-search-group">
              <input
                type="text"
                id="omdb-input"
                placeholder="Введіть назву англійською (напр. Interstellar)..."
              />
              <button type="button" id="omdb-search-btn">Пошук</button>
            </div>
            <div id="omdb-card-result"></div>
          </div>

          <div id="tab-manual" class="tab-panel">
            <form id="movie-form">
              <label for="movie-input">Назва фільму:</label>
              <input
                type="text"
                id="movie-input"
                placeholder="Введіть назву фільму"
              />
              <span id="title-error" class="error-message"></span>

              <label for="movie-year">Рік випуску:</label>
              <input
                type="number"
                id="movie-year"
                value="2026"
                placeholder="Рік випуску"
              />
              <span id="year-error" class="error-message"></span>

              <label for="movie-genre">Оберіть жанр:</label>
              <select id="movie-genre">
                <option value="Фантастика">Фантастика</option>
                <option value="Драма">Драма</option>
                <option value="Бойовик">Бойовик</option>
                <option value="Комедія">Комедія</option>
              </select>

              <label class="checkbox-label">
                <input type="checkbox" id="movie-watched" /> Уже переглянуто
              </label>

              <button type="submit" id="add-button">Додати фільм</button>
            </form>
          </div>
        </div>
      </div>

      <div id="list-control-panel">
        <input
          type="text"
          id="search-input"
          placeholder="Швидкий фільтр списку..."
        />
        <button id="clear-button">Очистити</button>
      </div>

      <p id="search-result" class="search-info"></p>

      <p id="toast" class="toast-message"></p>

      <ul id="movie-list"></ul>
    </div>

    <script type="module" src="js/script.js"></script>
  </body>
</html>
